<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机房 DNS 改址 / 撤销演示</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --fg:#e2e8f0;
          --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex;
           justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  header h1 { margin:0; font-size:18px; }
  header .meta { color:var(--muted); font-size:12px; }
  main { padding:20px 24px; display:grid; gap:18px;
         grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  label { color:var(--muted); font-size:12px; }
  input, select, button { border-radius:6px; border:1px solid var(--line);
         background:#0b1220; color:var(--fg); padding:7px 10px; font-size:13px; }
  input { min-width:120px; }
  button { cursor:pointer; background:#0369a1; border-color:#0284c7; }
  button.danger { background:#b91c1c; border-color:#dc2626; }
  button.ghost { background:#334155; border-color:#475569; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; }
  .pill.ok { background:rgba(34,197,94,.18); color:var(--ok); }
  .pill.warn { background:rgba(245,158,11,.18); color:var(--warn); }
  .pill.err { background:rgba(239,68,68,.18); color:var(--err); }
  .pill.muted { background:rgba(148,163,184,.18); color:var(--muted); }
  pre { background:#0b1220; border:1px solid var(--line); border-radius:8px;
        padding:10px; overflow:auto; font-size:12px; max-height:340px; }
  .muted { color:var(--muted); }
  .domain-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .domain-head code { color:var(--accent); font-size:14px; }
  #toast { position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column; gap:8px; z-index:9; }
  .toast-item { padding:10px 14px; border-radius:8px; background:#064e3b; border:1px solid #059669; }
  .toast-item.err { background:#7f1d1d; border-color:#dc2626; }
  .full { grid-column: 1 / -1; }
  .kv { display:grid; grid-template-columns: 130px 1fr; gap:4px 10px; font-size:12.5px; }
  .kv .k { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>机房 DNS 改址 / 撤销演示台</h1>
  <div class="meta">
    权威→SQLite 实时读取 ｜ 解析器仅内存缓存，重启即清空 ｜
    查询入口：<span id="resolver-endpoint">-</span>
  </div>
</header>

<main>
  <section class="card">
    <h2>① 全局负缓存 TTL（NXDOMAIN 按 SOA minimum 失效，秒）</h2>
    <div class="row">
      <label>负 TTL</label>
      <input id="neg-ttl" type="number" min="0" max="86400" style="min-width:100px">
      <button onclick="saveNegTtl()">保存负 TTL</button>
      <span class="muted">对之后新产生的 NXDOMAIN 生效</span>
    </div>
  </section>

  <section class="card">
    <h2>② 发起真实 UDP 查询</h2>
    <div class="row">
      <label>域名</label>
      <select id="q-name"></select>
      <label>等待上限(ms)</label>
      <input id="q-timeout" type="number" value="1500" min="100" max="10000" style="min-width:100px">
      <button onclick="runQuery()">发起查询</button>
    </div>
    <div id="query-result" class="muted">尚未查询</div>
  </section>

  <div id="domain-cards" style="display:contents"></div>

  <section class="card full">
    <h2>③ 解析器实时状态（剩余 TTL / 回源次数 / 单飞）
      <button class="ghost" style="float:right" onclick="refresh()">刷新</button>
      <label style="float:right; margin-right:10px">
        <input type="checkbox" id="auto-refresh" onchange="toggleAuto()"> 每 2 秒自动刷新
      </label>
    </h2>
    <table id="stats-table">
      <thead><tr>
        <th>域名</th><th>缓存</th><th>种类</th><th>RCODE</th><th>应答数据</th>
        <th>原始 TTL</th><th>剩余 TTL</th><th>回源次数</th>
        <th>正在回源</th><th>等待者</th><th>最近错误</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <p class="muted" style="margin-bottom:0">
      总查询数：<span id="total-queries">-</span> ｜
      回源失败数：<span id="upstream-failures">-</span> ｜
      回源地址：<span id="upstream-info">-</span>
    </p>
  </section>

  <section class="card full">
    <h2>④ 最近一次查询原始报文（JSON）</h2>
    <pre id="raw-json">无</pre>
  </section>
</main>

<div id="toast"></div>

<script>
let state = null;
let timer = null;

function toast(msg, isErr) {
  const el = document.createElement('div');
  el.className = 'toast-item' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, opts) {
  const resp = await fetch(path, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) { toast((data.detail || resp.statusText), true); throw new Error(data.detail || 'error'); }
  return data;
}

function jsonOpts(method, body) {
  return { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) };
}

function pill(text, cls) { return `<span class="pill ${cls}">${text}</span>`; }

function renderDomainCards() {
  const wrap = document.getElementById('domain-cards');
  wrap.innerHTML = '';
  state.domains.forEach((d, idx) => {
    const card = document.createElement('section');
    card.className = 'card';
    const rec = d.record;
    card.innerHTML = `
      <div class="domain-head"><code>${d.name}</code>
        ${rec ? pill('A ' + rec.ip + ' (TTL ' + rec.ttl + 's)', 'ok')
               : pill('无 A 记录（权威将回 NXDOMAIN）', 'warn')}
      </div>
      <div class="row">
        <label>新 IP</label>
        <input id="ip-${idx}" value="${rec ? rec.ip : '10.0.0.' + (20 + idx)}" placeholder="10.0.0.x">
        <label>TTL(s)</label>
        <input id="ttl-${idx}" type="number" min="1" max="86400" value="${rec ? rec.ttl : 30}" style="min-width:90px">
        <button onclick="saveRecord('${d.name}', ${idx})">设置 / 改址</button>
        <button class="danger" onclick="removeRecord('${d.name}')">删除记录（撤销）</button>
      </div>
      <div class="row">
        <label>权威回包延迟(ms)</label>
        <input id="delay-${idx}" type="number" min="0" max="30000" value="${d.delay_ms}" style="min-width:100px">
        <button class="ghost" onclick="saveDelay('${d.name}', ${idx})">应用延迟</button>
        <label style="margin-left:14px">
          <input type="checkbox" id="drop-${idx}" ${d.dropped ? 'checked' : ''}>
          模拟权威故障（静默丢包，不回 UDP）
        </label>
        <button class="ghost" onclick="saveDrop('${d.name}', ${idx})">应用故障开关</button>
      </div>`;
    wrap.appendChild(card);
  });
  const sel = document.getElementById('q-name');
  sel.innerHTML = state.domains.map(d => `<option>${d.name}</option>`).join('');
}

function renderStats() {
  const r = state.resolver || {};
  document.getElementById('resolver-endpoint').textContent = state.resolver_endpoint || '-';
  document.getElementById('total-queries').textContent = r.total_queries ?? '-';
  document.getElementById('upstream-failures').textContent = r.upstream_failures ?? '-';
  document.getElementById('upstream-info').textContent =
    (r.upstream || '-') + '（超时 ' + (r.upstream_timeout_s ?? '-') + 's）';
  const tbody = document.querySelector('#stats-table tbody');
  const names = r.names || {};
  const allNames = new Set([...(state.domains.map(d => d.name)), ...Object.keys(names)]);
  tbody.innerHTML = [...allNames].sort().map(n => {
    const s = names[n] || {};
    let cachePill;
    if (s.cached) cachePill = pill('有效缓存', 'ok');
    else if (s.expired) cachePill = pill('已过期（禁止沿用）', 'err');
    else cachePill = pill('无缓存（将回源）', 'muted');
    const kind = s.cache_kind ? pill(s.cache_kind === 'positive' ? '正缓存 A' : '负缓存 NXDOMAIN',
                                     s.cache_kind === 'positive' ? 'ok' : 'warn') : '-';
    return `<tr>
      <td><code>${n}</code></td>
      <td>${cachePill}</td>
      <td>${kind}</td>
      <td>${s.rcode ?? '-'}</td>
      <td>${(s.rdata && s.rdata.length) ? s.rdata.join(', ') : '-'}</td>
      <td>${s.ttl_original ?? '-'}</td>
      <td><b>${s.ttl_remaining ?? '-'}</b></td>
      <td><b>${s.upstream_attempts ?? 0}</b></td>
      <td>${s.inflight ? pill('回源中 ' + s.inflight_age_ms + 'ms', 'warn') : '-'}</td>
      <td>${s.inflight ? s.inflight_waiters : '-'}</td>
      <td>${s.last_error ? pill(s.last_error, 'err') : '-'}</td>
    </tr>`;
  }).join('');
}

async function refresh() {
  state = await api('/api/state');
  document.getElementById('neg-ttl').value = state.settings.neg_ttl;
  renderDomainCards();
  renderStats();
}

async function saveRecord(name, idx) {
  const ip = document.getElementById('ip-' + idx).value.trim();
  const ttl = parseInt(document.getElementById('ttl-' + idx).value, 10);
  await api(`/api/domains/${name}/record`, jsonOpts('POST', {ip, ttl}));
  toast(`${name} A 记录已写入：${ip} TTL=${ttl}s`);
  refresh();
}

async function removeRecord(name) {
  await api(`/api/domains/${name}/record`, {method: 'DELETE'});
  toast(`${name} 记录已删除（权威将回 NXDOMAIN）`);
  refresh();
}

async function saveNegTtl() {
  const neg_ttl = parseInt(document.getElementById('neg-ttl').value, 10);
  await api('/api/settings/neg-ttl', jsonOpts('PUT', {neg_ttl}));
  toast('负缓存 TTL 已保存：' + neg_ttl + 's');
  refresh();
}

async function saveDelay(name, idx) {
  const delay_ms = parseInt(document.getElementById('delay-' + idx).value, 10);
  await api(`/api/domains/${name}/delay`, jsonOpts('PUT', {delay_ms}));
  toast(`${name} 权威回包延迟=${delay_ms}ms`);
  refresh();
}

async function saveDrop(name, idx) {
  const dropped = document.getElementById('drop-' + idx).checked;
  await api(`/api/domains/${name}/drop`, jsonOpts('PUT', {dropped}));
  toast(`${name} 故障开关=${dropped}`);
  refresh();
}

async function runQuery() {
  const name = document.getElementById('q-name').value;
  const timeout_ms = parseInt(document.getElementById('q-timeout').value, 10);
  const box = document.getElementById('query-result');
  box.innerHTML = '<span class="muted">查询中…</span>';
  const data = await api('/api/query', jsonOpts('POST', {name, timeout_ms}));
  document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2);

  if (data.timed_out) {
    box.innerHTML = pill('客户端等待超时（' + data.timeout_ms + 'ms），解析器侧回源不受影响', 'err');
  } else if (data.status === 'error') {
    box.innerHTML = pill('查询出错：' + data.error, 'err');
  } else {
    const cls = data.rcode === 0 ? 'ok' : (data.rcode === 3 ? 'warn' : 'err');
    const idOk = data.answer_id_matches
      ? pill('DNS ID 一致 #' + data.dns_id, 'ok')
      : pill('DNS ID 不匹配', 'err');
    const answers = (data.answers || []).map(a => `${a.rdata} TTL=${a.ttl}`).join('；') || '（无应答段）';
    const s = data.resolver_stats || {};
    box.innerHTML = `
      <div class="kv">
        <span class="k">结果码</span><span>${pill(data.rcode_text, cls)} AA=${data.aa ? 1 : 0} ${idOk}</span>
        <span class="k">应答</span><span>${answers}</span>
        <span class="k">剩余 TTL</span><span><b>${s.ttl_remaining ?? '-'}</b> / 原始 ${s.ttl_original ?? '-'}s</span>
        <span class="k">缓存种类</span><span>${s.cache_kind ?? '-'}（${s.cached ? '命中缓存' : '本次回源'}）</span>
        <span class="k">该域名回源次数</span><span><b>${s.upstream_attempts ?? '-'}</b></span>
      </div>`;
  }
  refresh();
}

function toggleAuto() {
  if (document.getElementById('auto-refresh').checked) {
    timer = setInterval(refresh, 2000);
  } else {
    clearInterval(timer);
  }
}

refresh().catch(e => toast('初始化失败：' + e.message, true));
</script>
</body>
</html>
